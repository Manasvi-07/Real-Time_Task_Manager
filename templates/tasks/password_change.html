<!DOCTYPE html>
<html>
<head>
  <title>  Change Password </title>
</head>
<body>
  <h2>Change Password</h2>

  <form id="changePasswordForm">
    <label>Old Password:</label><br>
    <input type="password" id="oldPassword" required><br><br>

    <label>New Password:</label><br>
    <input type="password" id="newPassword" required><br><br>

    <button type="submit">Change Password</button>
    <button onclick="window.location.href='/tasks/user_profile/'">Cancel</button>
  </form>

  <p id="message"></p>

  <script>
    document.getElementById("changePasswordForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const oldPassword = document.getElementById("oldPassword").value;
      const newPassword = document.getElementById("newPassword").value;
      const token = localStorage.getItem("access");

      fetch("/api/accounts/password-change/", {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token,
        },
        body: JSON.stringify({
          old_password: oldPassword,
          new_password: newPassword
        })
      })
      .then(res => res.json().then(data => ({ status: res.status, body: data })))
      .then(({ status, body }) => {
        const messageEl = document.getElementById("message");

        if (status === 200) {
          messageEl.innerText = body.detail;
          document.getElementById("changePasswordForm").reset();
          window.location.href = "/tasks/login/";
        } else {
          messageEl.innerText = body.detail || "Something went wrong.";
        }
      })
      .catch(error => {
        document.getElementById("message");
        document.getElementById("message").innerText = "An error occurred.";
        console.error(error);
      });
    });
  </script>
</body>
</html>
