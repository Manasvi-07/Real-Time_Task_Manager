<!DOCTYPE html>
<html>
<head>
    <title> Task List </title>
</head>
<body>
    <h1>All Tasks</h1>
    <button onclick="window.location.href='/tasks/dashboard/'">Home Page</button>

    <hr>
    <div id="task-list" class="task-container"></div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem("access");
            const userId = localStorage.getItem("user_id");
            const role = localStorage.getItem("role");

            if (!token || !userId || !role) {
                alert("You are not logged in. Redirecting to login...");
                window.location.href = "/tasks/login/";
                return;
            }

            try {
                const response = await fetch("/api/tasks/", {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (!response.ok) {
                    const error = await response.json();
                    console.error("Fetch failed:", error);
                    alert(`Failed to fetch tasks: ${error.detail || error}`);
                    return;
                }

                const tasks = await response.json();
                const taskList = document.getElementById("task-list");
                taskList.innerHTML = "";

                tasks.forEach(task => {
                    const creatorId = task.created_by;
                    const assigneeId = task.assigned_to;
                    const isCreator = creatorId !== null && String(creatorId) === String(userId);
                    const isAssignee = assigneeId !== null && String(assigneeId) === String(userId);

                    const canEdit =
                        role === "admin" ||
                        (role === "manager" && isCreator) ||
                        (role === "employee" && isAssignee);

                    const canDelete =
                        role === "admin" || (role === "manager" && isCreator);

                    const taskItem = document.createElement("div");
                    taskItem.classList.add("task-item");

                    taskItem.innerHTML = `
                        <strong>Title:</strong> ${task.title}<br>
                        <strong>Description:</strong> ${task.description}<br>
                        <strong>Priority:</strong> ${task.priority}<br>
                        <strong>Status:</strong> ${task.status}<br>
                        <strong>Due Date:</strong> ${task.due_date}<br>
                        <strong>Created by:</strong> ${task.created_by_email}<br>
                        <strong>Assigned to:</strong> ${task.assigned_to_email || "Unassigned"}<br>
                        <div class="task-actions">
                            <button onclick="viewTaskDetails(${task.id})">Task Details</button>
                            <button onclick="taskAttachfile(${task.id})">Task Attachfile</button>
                            ${canEdit ? `<button onclick="editTask(${task.id})">Edit</button>` : ""}
                            ${canDelete ? `<button onclick="deleteTask(${task.id})">Delete</button>` : ""}
                        </div>
                        <hr>
                    `;
                    taskList.appendChild(taskItem);
                });
            } catch (err) {
                console.error("Error loading tasks:", err);
                alert("Something went wrong while loading tasks.");
            }
      

        const socket = new WebSocket(`ws://${window.location.host}/ws/tasks/?token=${token}`);

            socket.onopen = () => console.log(" WebSocket connected");
    
            socket.onmessage = (event) => {
                console.log(" WebSocket message received:", event.data);
                const message = JSON.parse(event.data);
    
                if (message.type === "task_update") {
                    const task = message.data;  
                    const confirmed = confirm(`Task "${task.title}" was updated. Reload to see latest changes?`);
                    if (confirmed) location.reload();
                }
            };
    
            socket.onclose = () => console.warn(" WebSocket disconnected");
            socket.onerror = (e) => console.error(" WebSocket error:", e);

        });

        function editTask(taskId) {
            const role = localStorage.getItem("role");
            if (role === "employee") {
                window.location.href = `/tasks/update_status/?task=${taskId}`;
            } else {
                window.location.href = `/tasks/task_update/?task=${taskId}`;
            }
        }

        function viewTaskDetails(taskId) {
            window.location.href = `/tasks/task_detail/?task=${taskId}`;
        }

        function taskAttachfile(taskId) {
            window.location.href = `/tasks/attachfile/?task=${taskId}`;
        }

        async function deleteTask(taskId) {
            const confirmed = confirm("Are you sure you want to delete this task?");
            if (!confirmed) return;

            const token = localStorage.getItem("access");

            try {
                const response = await fetch(`/api/tasks/detail/${taskId}/`, {
                    method: "DELETE",
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (response.ok) {
                    alert("Task deleted successfully.");
                    location.reload();
                } else {
                    alert("You are not authorized to delete this task.");
                }
            } catch (err) {
                console.error("Delete error:", err);
                alert("Failed to delete task.");
            }
        }
   </script>
</body>
</html>
