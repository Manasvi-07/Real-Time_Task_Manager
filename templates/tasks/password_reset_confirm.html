<!DOCTYPE html>
<html>
<head>
  <title> Set New Password </title>
</head>
<body>
  <h2>Set New Password</h2>

  <form method="post" action="{% url 'password_reset_confirm' %}">
    <label>User ID:</label>
    <input type="number" name="uid" placeholder="User ID" required><br><br>

    <label>Reset Token:</label>
    <input type="text" name="token" placeholder="Token from email" required><br><br>

    <label>New Password:</label>
    <input type="password" name="password" placeholder="New password" required><br><br>

    <button type="submit">Reset Password</button>
    <button onclick="window.location.href='/tasks/login/'">Cancel</button>
  </form>

  <div id="message"></div>
  <script>
    document.getElementById("reset-confirm-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const uid = document.getElementById("uid").value;
      const token = document.getElementById("access").value;
      const password = document.getElementById("new-password").value;
      const messageBox = document.getElementById("message");

      try {
        const res = await fetch("/api/accounts/password-reset-confirm/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ uid, token, password}),
        });

        const data = await res.json();

        if (res.ok) {
          messageBox.textContent = data.detail || "Password reset successful!";
          window.location.href = "/tasks/login/";
        } else {
          messageBox.textContent = data.detail || "Failed to reset password.";
        }
      } catch (err) {
        console.error("Error:", err);
        messageBox.textContent = "Server error. Please try again.";
      }
    });
  </script>
</body>
</html>
