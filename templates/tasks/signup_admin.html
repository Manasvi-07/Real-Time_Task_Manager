<!DOCTYPE html>
<html>
    <head>
        <title> Admin SignUp </title>
    </head>
    <body>
        <h2>Admin SignUp</h2>
        <form id="admin-signup-form">
            <label> Email :</label>
            <input type="email" id="email" placeholder="Email" required /><br><br>
            <label> Password :</label>
            <input type="password" id="password" placeholder="Password" required /><br><br>
            <button type="submit"> Sign Up</button>
            <button onclick="window.location.href='/tasks/dashboard/'">Cancel</button>
        </form>

        <div id="message"></div>
        <script>
            document.getElementById("admin-signup-form").addEventListener("submit", async function (e) {
                e.preventDefault();
    
                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value;
                const messageBox = document.getElementById("message");
    
                try {
                    const response = await fetch("/api/accounts/signup/admin/", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({ email, password })
                    });
    
                    const data = await response.json();
    
                    if (response.ok) {
                        localStorage.setItem("access", data.access);
                        localStorage.setItem("refresh", data.refresh);
                        alert("Admin registered and logged in");
                        window.location.href = "/tasks/login/";
                    } else {
                        const errorMsg = data?.email?.[0] || data?.detail || "Signup failed.";
                        messageBox.innerText = errorMsg;
                        console.error("Signup error:", data);
                    }
    
                } catch (err) {
                    console.error("Network error:", err);
                    messageBox.innerText = "Could not connect to server.";
                }
            });
        </script>
    </body>
</html>
