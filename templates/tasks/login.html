<!DOCTYPE html>
<html>
<head>
    <title> Login - Task Manager </title>
</head>
<body>
    <h2>Login</h2>
    <form id="loginForm">
        <label>Email:</label>
        <input type="email" id="email" placeholder="Email" required><br><br>

        <label>Password:</label>
        <input type="password" id="password" placeholder="Password" required><br><br>

        <button type="submit">Login</button>
        <button onclick="window.location.href='/tasks/password_reset/'">Password-Reset</button>
    </form>

    <div id="message"></div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const messageBox = document.getElementById("message");

            try {
                const response = await fetch("/api/accounts/token/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ email, password }),
                });

                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem("access", result.access);
                    localStorage.setItem("refresh_token", result.refresh);
                    const userRes = await fetch("/api/accounts/users/", {
                        headers: { Authorization: `Bearer ${result.access}` }
                    });

                    const users = await userRes.json();
                    const currentUser = users.find(user => user.email === email);
                    
                    console.log(currentUser.id, currentUser.role)

                    if (currentUser) {
                        localStorage.setItem("user_id", currentUser.id);
                        localStorage.setItem("role", currentUser.role);
                        window.location.href = "/tasks/dashboard/";
                    } else {
                        messageBox.innerText = "User not found.";
                    }
                } else {
                    messageBox.innerText = result.detail || "Invalid credentials.";
                }

            } catch (error) {
                console.error("Login error:", error);
                messageBox.innerText = "Server error. Please try again later.";
            }
        });

    </script>
</body>
</html>
