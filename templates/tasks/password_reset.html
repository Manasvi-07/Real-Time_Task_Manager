<!DOCTYPE html>
<html>
<head>
    <title>Reset Password - Task Manager </title>
</head>
<body>
    <h2>Reset Password</h2>

    <form id="reset-form">
        <label>Email:</label>
        <input type="email" id="reset-email" placeholder="Enter your email" required /><br><br>
        <button type="submit">Send Reset Link</button>
        <button onclick="window.location.href='/tasks/login/'">Cancel</button>
    </form>

    <div id="message"></div>

    <script>
        document.getElementById("reset-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("reset-email").value;
            const messageBox = document.getElementById("message");

            try {
                const res = await fetch("/api/accounts/password-reset/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email }),
                });

                const data = await res.json();

                if (res.ok) {
                    messageBox.textContent = data.detail || "Reset link sent. Check your email.";
                    window.location.href = "/tasks/password_reset_confirm/";
                } else {
                    messageBox.textContent = data.detail || "Something went wrong.";
                }
            } catch (err) {
                console.error("Error sending reset email:", err);
                messageBox.textContent = "Server error. Please try again later.";
            }
        });
    </script>
</body>
</html>
